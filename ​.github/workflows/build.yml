name: Build Pou PS3 Homebrew

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Compilar Projeto (Makefile)
        run: |
          make

      - name: Salvar Artefato (.pkg)
        uses: actions/upload-artifact@v4
        with:
          name: pou-ps3-pkg
          path: |
            *.pkg
            *.self
